<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.A.M. - Global AI Management</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #fff;
      color: #333;
    }

    header {
      background: #222;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .card {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    .card h3 {
      margin-top: 15px;
      font-size: 1.2rem;
    }

    .card p {
      color: #666;
      font-size: 0.9rem;
    }

    footer {
      background: #eee;
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: #666;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>G.A.M.</h1>
    <p>Global AI Management</p>
  </header>

  <main>
    <section class="intro" style="text-align:center;">
      <h2>우리 팀을 소개합니다</h2>
      <p>G.A.M.은 AI 기술과 글로벌 마인드를 바탕으로 문제를 해결하는 팀입니다.</p>
    </section>

    <section class="grid">
      <!-- 팀원 카드 -->
      <div class="card">
        
        <h3>강병찬</h3>
        <p>G</p>
        <p>디자이너</p>
      </div>
      <div class="card">
        
        <h3>안병윤</h3>
        <p>A</p>
        <p>팀 리더</p>
      </div>
      <div class="card">
        
        <h3>민종석</h3>
        <p>M</p>
        <p>시스템 아키텍처</p>
      </div>
      <div class="card">
        
        <h3>김준권</h3>
        <p>백엔드</p>
      </div>
      <div class="card">
        
        <h3>이주석</h3>
        <p>배포 관리</p>
      </div>
      <!-- 팀 모토 -->
      <div class="card" style="background: #dceeff;">
        <h3>“우리는 AI를 통해</h3>
        <p>세상을 더 나은 방향으로 이끕니다.”</p>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 G.A.M. - Global AI Management
  </footer>

</body>
</html>
