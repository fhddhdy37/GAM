<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>강병찬 페이지 준비중</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
        background: #f7f7f7;
      }
      .container {
        text-align: center;
        padding: 40px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .container h1 {
        margin-bottom: 20px;
        font-size: 2rem;
      }
      .container p {
        font-size: 1.2rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>페이지 준비중</h1>
      <p>곧 강병찬님의 페이지를 만나보실 수 있습니다.</p>
    </div>
  </body>
</html>
